<!DOCTYPE html>
<html>
<head>
    <title>Redefinição de Senha</title>
</head>
<body>
    <p>Olá,</p>
    <p>Você solicitou a redefinição da sua senha.</p>
    <p>Use o seguinte token para redefinir sua senha:</p>
    <h2>{{ token }}</h2>
    <p>Você pode usá-lo na página de redefinição de senha da nossa aplicação.</p>
    <p>Se você não solicitou isso, por favor, ignore este email.</p>
    <p>Obrigado!</p>
</body>
</html>
